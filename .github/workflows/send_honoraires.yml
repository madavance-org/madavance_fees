name: Envoi notes d'honoraires

on:
  schedule:
    - cron: '0 8 1 * *'  # Le 1er de chaque mois à 8h UTC
  workflow_dispatch:      # Déclenchement manuel possible
    inputs:
      mois:
        description: "Mois à envoyer, de 1 à 12 (vide = mois courant)"
        required: false
        default: ""
      annee:
        description: "Année, ex. 2026 (vide = année courante)"
        required: false
        default: ""

jobs:
  send-honoraires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install msal requests openpyxl

      - name: Envoyer les emails
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          MOIS: ${{ inputs.mois }}
          ANNEE: ${{ inputs.annee }}
        run: python send_honoraires.py
